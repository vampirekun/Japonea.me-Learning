name: Validate browser storage handling

on:
  pull_request:
    paths:
      - "app.js"
      - "tests/storage.test.mjs"
      - ".github/workflows/storage-safety.yml"
  push:
    branches: [main]
    paths:
      - "app.js"
      - "tests/storage.test.mjs"
      - ".github/workflows/storage-safety.yml"

permissions:
  contents: read

jobs:
  storage-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test corrupted and unavailable storage
        run: node --test tests/storage.test.mjs
      - name: Check application syntax
        run: node --check app.js
