name: Validate service worker

on:
  push:
    branches: [main]
    paths:
      - "sw.js"
      - "tests/service-worker.test.mjs"
      - ".github/workflows/service-worker.yml"
  pull_request:
    paths:
      - "sw.js"
      - "tests/service-worker.test.mjs"
      - ".github/workflows/service-worker.yml"

permissions:
  contents: read

jobs:
  service-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test service worker routing and cache safety
        run: node --test tests/service-worker.test.mjs
